format_version = 6
id = "ff7.sephiroth"
version = "0.1.0"
name = "Sephiroth"
author = "Final Fantasy VII Recompiled project"
description = "Adds Sephiroth as an independent party member, unlocked whenever party changes are allowed. Fresh records start three levels above Cloud."
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94163"

# Runs on the shared expanded-party adapters (src/ff7_party*.c). Its
# developer-only audit and query instruments stay in ff7.expanded-party.
[[feature]]
id = "sephiroth"
name = "Sephiroth"
channel = "experimental"
description = "Sephiroth is unlocked whenever party changes are allowed, while story-required parties stay intact. A fresh record starts three levels above Cloud (up to level 99), then keeps its own stats and saved progress. PHS, equipment, materia, menus, battle and EXP/AP work like the original cast. Vincent stays unchanged. Field animations, limits and some story scenes are still in progress. Requires a fresh launch; keep a backup of your memory card."
group = "Characters"
default_enabled = false

[[plugin]]
feature = "sephiroth"
id = "ff7.party-gameplay"
