format_version = 6
id = "ff7.diagnostics"
version = "1.0.0"
name = "Playtest Diagnostics"
author = "Final Fantasy VII Recompiled project"
description = "Record gameplay inputs and starting saves/settings for verified offline replay. See docs/DIAGNOSTICS.md for collection and sharing instructions."
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94163"

[[feature]]
id = "recording"
name = "Input Recording"
channel = "stable"
group = "Diagnostics"
description = "Record a diagnostic session under saves/diagnostics. Quit normally after reproducing a problem, then zip the entire session folder. Includes starting memory cards; no MP4 or audio file is recorded."
default_enabled = false

[[feature]]
id = "osd"
name = "Input Display"
channel = "stable"
group = "Diagnostics"
description = "Show accepted controller buttons, frame count and REC/PLAY/ERROR status. This display can be enabled separately from recording."
default_enabled = false

[[plugin]]
feature = "recording"
id = "ff7.diagnostics"

[[plugin]]
feature = "osd"
id = "ff7.diagnostics.osd"
